<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | INKSPIRED Luxury</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style_append.css">
</head>
<body>
  <!-- Animated Background -->
  <div class="bg-canvas"></div>
  <div class="grain-overlay"></div>
  <div class="floating-orb" style="width: 384px; height: 384px; background: #FFC9DE; top: -10%; left: -5%;"></div>
  <div class="floating-orb" style="width: 500px; height: 500px; background: #FFDFDF; bottom: -10%; right: -10%;"></div>
  <div id="mouseGlow"></div>

  <!-- Pill Navbar -->
  <nav id="pill-nav">
    <a href="index.html" class="nav-logo">
      INK<span>SPIRED</span>
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link-pill">Home</a>
      <a href="index.html#featured" class="nav-link-pill">Featured</a>
      <a href="products.html" class="nav-link-pill">Products</a>
      <a href="index.html#shop" class="nav-link-pill">Shop</a>
      <a href="index.html#craft" class="nav-link-pill">Craftsmanship</a>
    </div>
    <div class="nav-actions">
      <a href="cart.html" class="nav-link-pill" style="display: flex; align-items: center; gap: 6px;" aria-label="Shopping bag">
        <i class="ti ti-shopping-bag"></i>
        <span id="cart-count">0</span>
      </a>
      <button type="button" onclick="openSearchModal()" aria-label="Search" title="Search">
        <i class="ti ti-search"></i>
      </button>
      <a href="signin.html" class="nav-link-pill" aria-label="Sign in">
        <i class="ti ti-user"></i>
      </a>
      <button type="button" onclick="toggleMobileMenu()" class="mobile-menu-toggle" aria-label="Menu" title="Menu">
        <i class="ti ti-menu-2"></i>
      </button>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div id="mobileMenuOverlay" class="mobile-menu-overlay" onclick="toggleMobileMenu()"></div>
  <div id="mobileMenuPanel" class="mobile-menu-panel">
    <div class="mobile-menu-header">
      <span class="nav-logo">INK<span>SPIRED</span></span>
      <button onclick="toggleMobileMenu()" aria-label="Close"><i class="ti ti-x"></i></button>
    </div>
    <div class="mobile-menu-links">
      <a href="index.html"><i class="ti ti-home"></i> Home</a>
      <a href="index.html#featured"><i class="ti ti-star"></i> Featured</a>
      <a href="products.html"><i class="ti ti-package"></i> Products</a>
      <a href="index.html#shop"><i class="ti ti-shopping-bag"></i> Shop</a>
      <a href="index.html#craft"><i class="ti ti-writing"></i> Craftsmanship</a>
      <a href="cart.html"><i class="ti ti-cart"></i> Cart</a>
      <a href="contact.html"><i class="ti ti-message"></i> Contact</a>
      <a href="signin.html"><i class="ti ti-user"></i> Sign In</a>
    </div>
  </div>

  <!-- Auth Hero -->
  <section class="products-hero">
    <div class="container">
      <h1 class="page-title">Welcome</h1>
      <p class="page-subtitle">Sign in to your account or create a new one</p>
    </div>
  </section>

   <!-- Auth Forms -->
   <section class="products-section" style="padding-top: 0;">
     <div class="container" style="max-width: 480px;">
       <div class="product-card" style="margin-top: -60px; position: relative; z-index: 10;">
         <div class="card-body" style="padding: 48px;">
           <!-- Tabs -->
           <div class="auth-tabs" style="display: flex; gap: 0; margin-bottom: 40px; background: rgba(255,255,255,0.5); border-radius: 9999px; padding: 4px; border: 1px solid rgba(255,255,255,0.6);">
             <button class="tab active" data-tab="login" style="flex: 1; padding: 12px 24px; border-radius: 9999px; font-size: 0.9rem; font-weight: 600; transition: all 0.3s ease; background: white; color: #c25e7c; box-shadow: 0 4px 12px rgba(194, 94, 124, 0.1);">Sign In</button>
             <button class="tab" data-tab="register" style="flex: 1; padding: 12px 24px; border-radius: 9999px; font-size: 0.9rem; font-weight: 600; transition: all 0.3s ease; background: transparent; color: #6b7280; border: none; cursor: pointer;">Create Account</button>
           </div>

           <!-- Login Form -->
           <form id="loginForm" class="auth-form">
             <div style="margin-bottom: 24px;">
               <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.875rem; color: #1A0F14;">Email Address</label>
               <input type="email" id="loginEmail" class="search-input" placeholder="your@email.com" required style="width: 100%; padding: 14px 20px; font-size: 1rem;">
             </div>
             <div style="margin-bottom: 32px;">
               <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.875rem; color: #1A0F14;">Password</label>
               <input type="password" id="loginPassword" class="search-input" placeholder="Enter your password" required style="width: 100%; padding: 14px 20px; font-size: 1rem;">
             </div>
             <button type="submit" class="btn-primary" style="width: 100%; padding: 16px 32px; font-size: 1rem; font-weight: 700; border-radius: 9999px; border: none; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 8px 24px rgba(194, 94, 124, 0.25);">Sign In</button>
           </form>

           <!-- Register Form (hidden by default) -->
           <form id="registerForm" class="auth-form" style="display: none;">
             <div style="margin-bottom: 20px;">
               <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.875rem; color: #1A0F14;">Full Name</label>
               <input type="text" id="registerName" class="search-input" placeholder="John Doe" required style="width: 100%; padding: 14px 20px; font-size: 1rem;">
             </div>
             <div style="margin-bottom: 20px;">
               <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.875rem; color: #1A0F14;">Email Address</label>
               <input type="email" id="registerEmail" class="search-input" placeholder="your@email.com" required style="width: 100%; padding: 14px 20px; font-size: 1rem;">
             </div>
             <div style="margin-bottom: 24px;">
               <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.875rem; color: #1A0F14;">Password</label>
               <input type="password" id="registerPassword" class="search-input" placeholder="Create a password (min 8 characters)" required minlength="8" style="width: 100%; padding: 14px 20px; font-size: 1rem;">
             </div>
             <button type="submit" class="btn-primary" style="width: 100%; padding: 16px 32px; font-size: 1rem; font-weight: 700; border-radius: 9999px; border: none; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 8px 24px rgba(194, 94, 124, 0.25);">Create Account</button>
           </form>

           <div style="display: flex; align-items: center; gap: 16px; margin-top: 32px; color: #6b7280; font-size: 0.875rem;">
             <div style="flex: 1; height: 1px; background: rgba(194, 94, 124, 0.2);"></div>
             <span>or continue with</span>
             <div style="flex: 1; height: 1px; background: rgba(194, 94, 124, 0.2);"></div>
           </div>

           <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px;">
             <button type="button" id="googleSignInBtn" style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; background: white; border: 1px solid rgba(194, 94, 124, 0.2); border-radius: 12px; font-size: 0.875rem; font-weight: 500; color: #4b5563; cursor: pointer; transition: all 0.2s ease;">
               <i class="fa-brands fa-google" style="color: #ea4335;"></i> Google
             </button>
             <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; background: white; border: 1px solid rgba(194, 94, 124, 0.2); border-radius: 12px; font-size: 0.875rem; font-weight: 500; color: #4b5563; cursor: pointer; transition: all 0.2s ease;">
               <i class="fa-brands fa-apple" style="color: #000;"></i> Apple
             </button>
           </div>

           <p style="text-align: center; margin-top: 32px; color: #6b7280; font-size: 0.875rem; line-height: 1.6;">
             By creating an account, you agree to our <a href="#" style="color: #c25e7c; text-decoration: none; font-weight: 600;">Terms of Service</a> and <a href="#" style="color: #c25e7c; text-decoration: none; font-weight: 600;">Privacy Policy</a>.
           </p>
         </div>
       </div>
     </div>
   </section>

  <!-- Search Modal -->
  <div id="searchOverlay" class="search-overlay" onclick="closeSearchModal()"></div>
  <div id="searchModal" class="search-modal">
    <div class="search-modal-header">
      <div class="search-input-wrap">
        <i class="ti ti-search"></i>
        <input type="text" id="globalSearchInput" placeholder="Search premium pens..." oninput="handleSearch(this.value)">
      </div>
      <button onclick="closeSearchModal()" aria-label="Close"><i class="ti ti-x"></i></button>
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>

   <script src="script.js"></script>
  <script>
    // Get current user
    function getUser() {
      try {
        return JSON.parse(localStorage.getItem('inkspired_user'));
      } catch (e) {
        return null;
      }
    }

    // Tab switching
    document.querySelectorAll('.auth-tabs .tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.auth-tabs .tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.getAttribute('data-tab');
        document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
      });
    });

    // Handle login
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      
      if (!email || !password) {
        alert('Please fill in all fields');
        return;
      }
      
      // For demo: accept any credentials
      const user = { email, name: email.split('@')[0] };
      localStorage.setItem('inkspired_user', JSON.stringify(user));
      
      // Update nav across site
      if (typeof updateNavUserState === 'function') {
        updateNavUserState();
      }
      
      alert('Welcome back! You are now signed in.');
      window.location.href = 'index.html';
    }

    // Handle registration
    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('registerName').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value;
      
      if (!name || !email || !password) {
        alert('Please fill in all fields');
        return;
      }
      
      if (password.length < 8) {
        alert('Password must be at least 8 characters');
        return;
      }
      
      const user = { email, name };
      localStorage.setItem('inkspired_user', JSON.stringify(user));
      
      // Update nav across site
      if (typeof updateNavUserState === 'function') {
        updateNavUserState();
      }
      
      alert('Account created successfully! Welcome to INKSPIRED.');
      window.location.href = 'index.html';
    }

    // Sign out
    function signOut() {
      localStorage.removeItem('inkspired_user');
      if (typeof updateNavUserState === 'function') {
        updateNavUserState();
      }
      window.location.href = 'index.html';
    }

    // Mobile menu
    function toggleMobileMenu() {
      const panel = document.getElementById('mobileMenuPanel');
      const overlay = document.getElementById('mobileMenuOverlay');
      if (panel && overlay) {
        if (panel.classList.contains('show')) {
          panel.classList.remove('show');
          overlay.classList.remove('show');
          document.body.style.overflow = '';
        } else {
          panel.classList.add('show');
          overlay.classList.add('show');
          document.body.style.overflow = 'hidden';
        }
      }
    }

    // Search
    function openSearchModal() {
      const modal = document.getElementById('searchModal');
      if (modal) {
        modal.style.display = 'flex';
        modal.style.opacity = '1';
        document.body.style.overflow = 'hidden';
        setTimeout(() => document.getElementById('globalSearchInput')?.focus(), 100);
      }
    }
    function closeSearchModal() {
      const modal = document.getElementById('searchModal');
      if (modal) {
        modal.style.display = 'none';
        modal.style.opacity = '0';
        document.body.style.overflow = '';
      }
    }

    // Cart count
    function updateCartCount() {
      const badge = document.getElementById('cart-count');
      if (badge) {
        try {
          const cart = JSON.parse(localStorage.getItem('inkspired_cart_v2') || '[]');
          const count = cart.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
          badge.textContent = count;
        } catch (e) {
          badge.textContent = '0';
        }
      }
    }

    // Google Sign-In (simulated for demo)
    function handleGoogleSignIn() {
      // In production, replace with real Google Identity Services
      // This demo simulates a successful Google OAuth flow
      const mockGoogleUser = {
        email: 'user@gmail.com',
        name: 'Google User',
        picture: 'https://ui-avatars.com/api/?name=Google+User&background=c25e7c&color=fff'
      };
      
      // Store user data
      localStorage.setItem('inkspired_user', JSON.stringify({
        email: mockGoogleUser.email,
        name: mockGoogleUser.name,
        provider: 'google'
      }));
      
      // Update nav state
      if (typeof updateNavUserState === 'function') {
        updateNavUserState();
      }
      
      alert('Signed in with Google successfully!');
      window.location.href = 'index.html';
    }

    // Initialize Google button
    document.addEventListener('DOMContentLoaded', () => {
      if (getUser()) {
        window.location.href = 'profile.html';
      }
      updateCartCount();
      updateNavUserState();

      // Google Sign-In button
      const googleBtn = document.getElementById('googleSignInBtn');
      if (googleBtn) {
        googleBtn.addEventListener('click', handleGoogleSignIn);
      }
    });
  </script>
</body>
</html>
