<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Authentication | INKSPIRED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style_append.css">
</head>
<body style="margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #FFF5F7;">

  <!-- Authentication Card -->
  <div style="width: 100%; max-width: 480px; padding: 32px;">
    <div class="glass-panel" style="background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(194, 94, 124, 0.15); border-radius: 24px; padding: 40px; box-shadow: 0 20px 60px -10px rgba(194, 94, 124, 0.15);">

      <!-- Back Button -->
      <div style="text-align: left; margin-bottom: 20px;">
        <a href="index.html" style="display: inline-flex; align-items: center; gap: 8px; color: #c25e7c; text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 8px 12px; border: 1px solid rgba(194, 94, 124, 0.2); border-radius: 8px; transition: all 0.3s; background: rgba(255, 255, 255, 0.5);">
          <i class="ti ti-arrow-left" style="font-size: 1rem;"></i> Back to Home
        </a>
      </div>

      <!-- Logo & Title -->
      <div style="text-align: center; margin-bottom: 40px;">
        <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 2rem; color: #1A0F14; margin-bottom: 8px;">
          INK<span style="color: #c25e7c;">SPIRED</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 6px; color: #c25e7c; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 12px;">
          <i class="fa-solid fa-crown"></i> Admin Access
        </div>
        <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700; color: #1A0F14; margin: 0 0 8px;">Administrator Login</h1>
        <p style="color: #6b7280; font-size: 0.9rem; margin: 0;">Enter your credentials to access the dashboard</p>
      </div>

      <!-- Login Form -->
      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
        <div style="margin-bottom: 20px;">
          <label for="adminEmail" style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.875rem; color: #1A0F14;">Email Address</label>
          <input type="email" id="adminEmail" class="form-input" placeholder="admin@inkspired.com" required style="width: 100%; padding: 14px 16px; border: 1px solid rgba(194, 94, 124, 0.2); border-radius: 12px; font-size: 1rem; background: white; transition: all 0.2s; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 28px;">
          <label for="adminPass" style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.875rem; color: #1A0F14;">Password</label>
          <input type="password" id="adminPass" class="form-input" placeholder="Enter your password" required style="width: 100%; padding: 14px 16px; border: 1px solid rgba(194, 94, 124, 0.2); border-radius: 12px; font-size: 1rem; background: white; transition: all 0.2s; box-sizing: border-box;">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 16px; font-size: 1rem; font-weight: 700; border-radius: 9999px; border: none; background: linear-gradient(135deg, #c25e7c, #a0455d); color: white; cursor: pointer; transition: all 0.3s; box-shadow: 0 8px 24px rgba(194, 94, 124, 0.25); margin-bottom: 20px;">
          <i class="ti ti-lock" style="margin-right: 8px;"></i> Sign In
        </button>
      </form>


    </div>
  </div>

  <!-- Success Redirect Overlay (shown after successful login) -->
  <div id="successOverlay" style="display: none; position: fixed; inset: 0; background: rgba(26, 15, 20, 0.9); z-index: 9999; align-items: center; justify-content: center;">
    <div style="text-align: center; color: white;">
      <i class="ti ti-check" style="font-size: 4rem; color: #10b981; margin-bottom: 24px;"></i>
      <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.75rem; font-weight: 700; margin: 0 0 8px;">Authentication Successful</h2>
      <p style="color: rgba(255,255,255,0.8); margin-bottom: 24px;">Redirecting to admin dashboard...</p>
    </div>
  </div>

  <script>
    // Admin credentials (in production, this would be server-side)
    const ADMIN_EMAIL = 'admin@inkspired.com';
    const ADMIN_PASSWORD = 'admin123';

    function handleAdminLogin(e) {
      e.preventDefault();
      
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPass').value;
      
      if (!email || !password) {
        alert('Please enter both email and password');
        return;
      }
      
      // Validate credentials
      if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
        // Store admin session
        const adminSession = {
          email: email,
          name: 'Administrator',
          role: 'admin',
          loggedInAt: new Date().toISOString()
        };
        localStorage.setItem('inkspired_admin_session', JSON.stringify(adminSession));
        
        // Show success overlay briefly before redirect
        document.getElementById('successOverlay').style.display = 'flex';
        
        setTimeout(() => {
          window.location.href = 'admin-dashboard.html';
        }, 1500);
      } else {
        alert('Invalid credentials. Please check your email and password.');
        // Shake animation for error feedback
        const form = document.querySelector('.glass-panel');
        form.style.animation = 'shake 0.5s';
        setTimeout(() => form.style.animation = '', 500);
      }
    }

    // Add shake animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
      }
    `;
    document.head.appendChild(style);

    // Check if already logged in
    document.addEventListener('DOMContentLoaded', () => {
      const session = localStorage.getItem('inkspired_admin_session');
      if (session) {
        try {
          const adminData = JSON.parse(session);
          if (adminData.role === 'admin') {
            // Already logged in, redirect to dashboard
            window.location.href = 'admin-dashboard.html';
          }
        } catch (e) {
          localStorage.removeItem('inkspired_admin_session');
        }
      }
    });
  </script>
</body>
</html>
